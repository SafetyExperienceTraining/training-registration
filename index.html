<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026年湖北省重点危险化学品企业自动化仪表作业人员工伤预防能力提升培训学员登记表</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 650px; margin: 0 auto; padding: 20px 16px; background: #f4f7f6; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 20px; line-height: 1.4; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 14px; background: #fff; }
        .btn-primary { width: 100%; padding: 14px; background: #07c160; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-download { padding: 14px 40px; background: #07c160; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-back { padding: 12px 30px; background: #fff; color: #666; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 15px; }
        .btn-alt { display: inline-block; margin-top: 12px; padding: 10px 24px; background: #3498db; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .preview-box { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .preview-box img, .preview-box canvas { max-width: 150px; max-height: 150px; border: 1px solid #ddd; border-radius: 4px; object-fit: cover; }
        .tip { font-size: 12px; color: #888; margin-top: 4px; }
        .error { font-size: 12px; color: #e74c3c; margin-top: 4px; display: none; }
        .hidden { display: none !important; }
        #successPage { text-align: center; padding: 40px 20px; }
        #successPage h3 { color: #07c160; font-size: 22px; margin-bottom: 15px; }
        #successPage p { color: #666; margin: 15px 0; line-height: 1.6; }
        #successPage .tip-text { font-size: 13px; color: #999; margin-top: 25px; }
        #pdfPreview { position: absolute; left: -9999px; top: 0; width: 794px; background: #fff; padding: 40px; font-family: '宋体', SimSun, serif; font-size: 14px; color: #000; line-height: 1.5; }
        #pdfPreview h1 { text-align: center; font-size: 18px; font-weight: bold; margin: 0 0 15px 0; font-family: '黑体', SimHei, sans-serif; }
        #pdfPreview table { width: 100%; border-collapse: collapse; border: 2px solid #000; }
        #pdfPreview td { border: 1px solid #000; padding: 6px 8px; vertical-align: middle; word-break: break-all; }
        #pdfPreview .label { background-color: #f0f0f0; font-weight: bold; text-align: center; width: 15%; }
        #pdfPreview .photo-cell { text-align: center; vertical-align: middle; padding: 8px; width: 16%; }
        #pdfPreview .photo-cell img { max-width: 80px; max-height: 110px; object-fit: contain; border: 1px solid #999; display: block; margin: 0 auto; }
        #pdfPreview .id-img { max-width: 90%; max-height: 200px; object-fit: contain; display: block; margin: 0 auto; }
        #pdfPreview .id-label { font-size: 12px; text-align: center; margin-top: 5px; color: #333; }
        #pdfPreview .footer { margin-top: 15px; font-size: 11px; text-align: center; color: #333; border-top: 1px dashed #666; padding-top: 8px; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        #loadingOverlay .spinner { background: #fff; padding: 30px 40px; border-radius: 12px; text-align: center; }
        #loadingOverlay .spinner p { margin-top: 15px; color: #666; font-size: 14px; }
        #wxTip { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 10000; justify-content: center; align-items: flex-start; padding-top: 20px; }
        #wxTip .box { background: #fff; border-radius: 12px; padding: 24px; max-width: 320px; text-align: center; font-size: 14px; line-height: 1.8; color: #333; }
        #wxTip .box .arrow { font-size: 36px; color: #07c160; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>📋 2026年湖北省重点危险化学品企业<br>自动化仪表作业人员工伤预防能力提升培训<br>学员登记表</h2>

<form id="regForm">
    <div class="form-group"><label>姓名 *</label><input name="name" required placeholder="请输入姓名"></div>
    <div class="form-group" style="display:flex; gap:15px;">
        <div style="flex:1;"><label>性别 *</label><select name="gender" id="genderSelect" required><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
        <div style="flex:1;"><label>年龄 *</label><input name="age" id="ageInput" type="number" required placeholder="填写身份证后自动识别" min="16" max="65"></div>
    </div>
    <div class="form-group">
        <label>身份证号 *</label>
        <input name="id_card" id="idCardInput" maxlength="18" required placeholder="请输入18位身份证号" autocomplete="off">
        <div class="tip">填写后系统将自动识别性别并校验年龄</div>
        <div class="error" id="idCardError"></div>
    </div>
    <div class="form-group">
        <label>联系电话 *</label>
        <input name="phone" id="phoneInput" type="tel" maxlength="11" required placeholder="请输入11位手机号" autocomplete="off">
        <div class="error" id="phoneError"></div>
    </div>
    <div class="form-group"><label>工作单位 *</label><input name="company" required placeholder="请输入单位全称"></div>
    <div class="form-group" style="display:flex; gap:15px;">
        <div style="flex:1;"><label>培训类别 *</label><select name="train_type" required><option value="工伤预防能力提升培训">工伤预防能力提升培训</option><option value="安全生产">安全生产</option><option value="技能提升">技能提升</option><option value="管理培训">管理培训</option></select></div>
        <div style="flex:1;"><label>培训班次 *</label><input name="train_class" placeholder="如：第一期" required></div>
    </div>
    <div class="form-group">
        <label>培训时间 *</label>
        <div style="display:flex; gap:10px; align-items:center;">
            <input name="train_date_start" type="date" required style="flex:1;">
            <span style="color:#666; font-weight:bold;">至</span>
            <input name="train_date_end" type="date" required style="flex:1;">
        </div>
    </div>
    <div class="form-group"><label>个人一寸照片 *</label><input type="file" accept="image/*" id="photoInput" required><div class="preview-box"><img id="photoPreview" class="hidden"></div></div>
    <div class="form-group"><label>身份证正面（人像面） *</label><input type="file" accept="image/*" id="frontInput" required><p class="tip">上传后系统将自动添加防伪水印</p><div class="preview-box"><canvas id="frontCanvas" class="hidden"></canvas></div></div>
    <div class="form-group"><label>身份证反面（国徽面） *</label><input type="file" accept="image/*" id="backInput" required><p class="tip">上传后系统将自动添加防伪水印</p><div class="preview-box"><canvas id="backCanvas" class="hidden"></canvas></div></div>
    <button type="submit" class="btn-primary" id="submitBtn">提交并生成PDF登记表</button>
</form>

<div id="successPage" class="hidden">
    <h3>✅ 提交成功！</h3>
    <p>请点击下方按钮下载PDF登记表</p>
    <button class="btn-download" id="downloadBtn">📥 点击下载PDF登记表</button><br>
    <button class="btn-alt hidden" id="openInBrowserBtn">🔗 在浏览器中打开后下载</button><br>
    <button class="btn-back" id="backBtn">返回重新填写</button>
    <p class="tip-text">💡 如果点击下载后没有反应：<br>• 安卓用户请检查浏览器是否拦截了下载弹窗；<br>• iPhone 用户请在弹窗中选择「存储到“文件”」；<br>• 微信内打开请点击「在浏览器中打开」后再下载。</p>
</div>

<div id="pdfPreview"></div>
<div id="loadingOverlay"><div class="spinner"><div style="font-size:36px;">⏳</div><p>正在生成PDF，请稍候...</p></div></div>
<div id="wxTip"><div class="box"><div class="arrow">↗</div><p>当前在微信内打开，下载功能可能受限。</p><p>请点击右上角 <b>⋯</b> → 选择「在浏览器中打开」</p><button class="btn-primary" style="margin-top:15px;" onclick="document.getElementById('wxTip').style.display='none'">我知道了</button></div></div>

<script>
(function() {
    'use strict';
    var currentFormData = null;
    var frontWatermarked = false;
    var backWatermarked = false;
    var ua = navigator.userAgent.toLowerCase();
    var isWeChat = /micromessenger/.test(ua);
    if (isWeChat) document.getElementById('wxTip').style.display = 'flex';

    function sanitizeIdCard(val) {
        return val
            .replace(/[\s\uFEFF\u200B\u200C\u200D\u00A0]/g, '')
            .replace(/[０-９]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
            .toUpperCase()
            .replace(/[^\dX]/g, '')
            .slice(0, 18);
    }

    document.getElementById('idCardInput').addEventListener('input', function(e) { e.target.value = sanitizeIdCard(e.target.value); });
    document.getElementById('phoneInput').addEventListener('input', function(e) { e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 11); });

    function validateIDCard(idCard) {
        if (!/^\d{17}[\dX]$/.test(idCard)) return { valid: false, msg: '身份证号格式不正确，应为17位数字+1位数字或X' };
        var year = parseInt(idCard.substring(6, 10), 10);
        var month = parseInt(idCard.substring(10, 12), 10);
        var day = parseInt(idCard.substring(12, 14), 10);
        var birthDate = new Date(year, month - 1, day);
        if (birthDate.getFullYear() !== year || birthDate.getMonth() !== month - 1 || birthDate.getDate() !== day) return { valid: false, msg: '身份证号中的出生日期无效（如2月30日不存在）' };
        var factor = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
        var checkCode = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
        var sum = 0;
        for (var i = 0; i < 17; i++) sum += parseInt(idCard.charAt(i), 10) * factor[i];
        if (idCard.charAt(17).toUpperCase() !== checkCode[sum % 11]) return { valid: false, msg: '身份证号校验码错误，请核对最后一位' };
        return { valid: true, msg: '' };
    }

    function parseIdCard(idCard) {
        var gender = parseInt(idCard.charAt(16), 10) % 2 === 1 ? '男' : '女';
        var year = parseInt(idCard.substring(6, 10), 10);
        var month = parseInt(idCard.substring(10, 12), 10) - 1;
        var day = parseInt(idCard.substring(12, 14), 10);
        var birth = new Date(year, month, day);
        var today = new Date();
        var age = today.getFullYear() - birth.getFullYear();
        if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
        return { gender: gender, age: age };
    }

    document.getElementById('idCardInput').addEventListener('blur', function() {
        var idCard = sanitizeIdCard(this.value.trim());
        var errorDiv = document.getElementById('idCardError');
        if (idCard.length === 0) { errorDiv.style.display = 'none'; return; }
        if (idCard.length < 18) { errorDiv.textContent = '身份证号需为18位，当前' + idCard.length + '位'; errorDiv.style.display = 'block'; return; }
        var result = validateIDCard(idCard);
        if (!result.valid) { errorDiv.textContent = result.msg; errorDiv.style.display = 'block'; return; }
        errorDiv.style.display = 'none';
        var info = parseIdCard(idCard);
        document.getElementById('genderSelect').value = info.gender;
        document.getElementById('ageInput').value = info.age;
    });

    function validatePhone(phone) { return /^1[3-9]\d{9}$/.test(phone); }
    function fileToBase64(file) { return new Promise(function(resolve, reject) { var reader = new FileReader(); reader.onload = function(e) { resolve(e.target.result); }; reader.onerror = reject; reader.readAsDataURL(file); }); }

    document.getElementById('photoInput').addEventListener('change', function(e) {
        if (e.target.files[0]) { var img = document.getElementById('photoPreview'); img.src = URL.createObjectURL(e.target.files[0]); img.classList.remove('hidden'); }
    });

    // ========== 【修改】增大水印间距 ==========
    function addWatermark(file, canvasId) {
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function(event) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById(canvasId);
                    var maxWidth = 800, width = img.width, height = img.height;
                    if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    ctx.fillStyle = 'rgba(220,30,30,0.18)';
                    var fontSize = Math.max(20, width / 25);
                    ctx.font = 'bold ' + fontSize + 'px "Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.save();
                    ctx.rotate(-25 * Math.PI / 180);
                    var text = '仅供工伤预防培训备案使用';
                    var tw = ctx.measureText(text).width;
                    // 水平间距：文字宽度 + 图片宽度的40%（原为25%）
                    var sx = tw + width / 2.5;
                    // 垂直间距：字号的4.5倍（原为3倍）
                    var sy = fontSize * 4.5;
                    for (var y = -height; y < height * 2; y += sy) {
                        for (var x = -width; x < width * 2; x += sx) {
                            ctx.fillText(text, x, y);
                        }
                    }
                    ctx.restore();
                    resolve(canvas);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('frontInput').addEventListener('change', function(e) { if (e.target.files[0]) addWatermark(e.target.files[0], 'frontCanvas').then(function(c) { c.classList.remove('hidden'); frontWatermarked = true; }); });
    document.getElementById('backInput').addEventListener('change', function(e) { if (e.target.files[0]) addWatermark(e.target.files[0], 'backCanvas').then(function(c) { c.classList.remove('hidden'); backWatermarked = true; }); });

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var rawIdCard = document.getElementById('idCardInput').value;
        var idCard = sanitizeIdCard(rawIdCard);
        var phone = document.getElementById('phoneInput').value.trim();
        var idErr = document.getElementById('idCardError');
        var phErr = document.getElementById('phoneError');

        if (idCard.length !== 18) { idErr.textContent = '身份证号必须为18位，当前' + idCard.length + '位'; idErr.style.display = 'block'; document.getElementById('idCardInput').focus(); return; }
        var idResult = validateIDCard(idCard);
        if (!idResult.valid) { idErr.textContent = idResult.msg; idErr.style.display = 'block'; document.getElementById('idCardInput').focus(); return; }
        idErr.style.display = 'none';

        if (!validatePhone(phone)) { phErr.textContent = '请输入有效的11位手机号（1开头）'; phErr.style.display = 'block'; document.getElementById('phoneInput').focus(); return; }
        phErr.style.display = 'none';

        var info = parseIdCard(idCard);
        document.getElementById('genderSelect').value = info.gender;
        document.getElementById('ageInput').value = info.age;

        if (!document.getElementById('photoInput').files[0] || !frontWatermarked || !backWatermarked) { alert('请完成所有图片上传（一寸照片、身份证正反面）'); return; }

        var fd = new FormData(this);
        currentFormData = {};
        fd.forEach(function(v, k) { currentFormData[k] = v; });
        currentFormData.gender = info.gender;
        currentFormData.age = String(info.age);
        currentFormData.id_card = idCard;

        currentFormData.photoBase64 = await fileToBase64(document.getElementById('photoInput').files[0]);
        currentFormData.frontBase64 = document.getElementById('frontCanvas').toDataURL('image/jpeg', 0.7);
        currentFormData.backBase64 = document.getElementById('backCanvas').toDataURL('image/jpeg', 0.7);

        document.getElementById('regForm').classList.add('hidden');
        document.getElementById('successPage').classList.remove('hidden');
        if (isWeChat) document.getElementById('openInBrowserBtn').classList.remove('hidden');
        window.scrollTo(0, 0);
    });

    document.getElementById('backBtn').addEventListener('click', function() {
        document.getElementById('successPage').classList.add('hidden');
        document.getElementById('regForm').classList.remove('hidden');
        window.scrollTo(0, 0);
    });

    document.getElementById('downloadBtn').addEventListener('click', async function() {
        if (!currentFormData) return;
        var loading = document.getElementById('loadingOverlay');
        loading.style.display = 'flex';
        try {
            var d = currentFormData;
            var html = '<h1>2026年湖北省重点危险化学品企业自动化仪表作业人员<br>工伤预防能力提升培训学员登记表</h1><table>';
            html += '<tr><td class="label">填写时间</td><td colspan="4">' + new Date().toLocaleString('zh-CN') + '</td><td class="photo-cell" rowspan="5"><img src="' + d.photoBase64 + '"></td></tr>';
            html += '<tr><td class="label">姓 名</td><td>' + d.name + '</td><td class="label">性 别</td><td colspan="2">' + d.gender + '</td></tr>';
            html += '<tr><td class="label">年 龄</td><td>' + d.age + '</td><td class="label">电 话</td><td colspan="2">' + d.phone + '</td></tr>';
            html += '<tr><td class="label">身份证号</td><td colspan="4">' + d.id_card + '</td></tr>';
            html += '<tr><td class="label">工作单位</td><td colspan="4">' + d.company + '</td></tr>';
            html += '<tr><td class="label">培训类别</td><td colspan="2">' + d.train_type + '</td><td class="label">培训班次</td><td colspan="2">' + d.train_class + '</td></tr>';
            html += '<tr><td class="label">培训时间</td><td colspan="5">' + d.train_date_start + ' 至 ' + d.train_date_end + '</td></tr>';
            html += '<tr><td class="label" colspan="6" style="text-align:center;background:#e6e6e6;font-weight:bold;padding:6px;">身份证复印件（系统已自动添加专属防伪水印）</td></tr>';
            html += '<tr><td colspan="6" style="text-align:center;padding:12px;"><img src="' + d.frontBase64 + '" class="id-img"><div class="id-label">正面（人像面）</div></td></tr>';
            html += '<tr><td colspan="6" style="text-align:center;padding:12px;"><img src="' + d.backBase64 + '" class="id-img"><div class="id-label">反面（国徽面）</div></td></tr>';
            html += '</table><div class="footer"><b>备注：</b>本表需由学员本人填写，培训结束后，由培训单位移交相关政府部门核对后归档备查。</div>';

            var preview = document.getElementById('pdfPreview');
            preview.innerHTML = html;
            await new Promise(function(resolve) {
                var imgs = preview.querySelectorAll('img'), loaded = 0;
                if (!imgs.length) { resolve(); return; }
                imgs.forEach(function(im) {
                    if (im.complete) { loaded++; if (loaded >= imgs.length) resolve(); }
                    else { im.onload = im.onerror = function() { loaded++; if (loaded >= imgs.length) resolve(); }; }
                });
                setTimeout(resolve, 3000);
            });

            var canvas = await html2canvas(preview, { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: 794 });
            var jsPDF = window.jspdf.jsPDF;
            var pdf = new jsPDF('p', 'pt', 'a4');
            var pdfW = 595, pdfH = 842;
            var imgData = canvas.toDataURL('image/jpeg', 0.92);
            var imgW = pdfW, imgH = (canvas.height * pdfW) / canvas.width;
            if (imgH > pdfH) imgH = pdfH;
            pdf.addImage(imgData, 'JPEG', 0, (pdfH - imgH) / 2, imgW, imgH);
            pdf.save((d.name || '学员') + '_工伤预防培训登记表.pdf');
        } catch (err) {
            console.error('PDF生成失败:', err);
            alert('PDF生成失败：' + err.message);
        } finally {
            loading.style.display = 'none';
        }
    });

    document.getElementById('openInBrowserBtn').addEventListener('click', function() { alert('请复制链接在浏览器中打开：\n' + window.location.href); });
})();
</script>
</body>
</html>
