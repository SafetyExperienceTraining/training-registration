<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训学员报名系统</title>
    <style>
        /* 网页端表单样式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 0 auto; padding: 20px; background: #f4f7f6; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #07c160; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #a4b0be; cursor: not-allowed; }
        .preview-box { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .preview-box img, .preview-box canvas { max-width: 150px; max-height: 150px; border: 1px solid #ddd; border-radius: 4px; object-fit: cover; }
        .tip { font-size: 12px; color: #888; margin-top: 4px; }
        .hidden { display: none !important; }

        /* ⚠️ 核心：PDF 打印专属样式 */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
            
            @page { size: A4 portrait; margin: 1.5cm; }
            
            body { font-family: '宋体', SimSun, serif !important; font-size: 10.5pt; color: #000; line-height: 1.2; background: #fff; }
            h1 { text-align: center; font-size: 18pt; font-weight: bold; margin: 0 0 12pt 0; letter-spacing: 2pt; font-family: '黑体', SimHei, sans-serif; }
            
            table { width: 100%; border-collapse: collapse; border: 1.5pt solid #000; page-break-inside: avoid; }
            td { border: 0.75pt solid #000; padding: 4pt 6pt; vertical-align: middle; font-size: 10.5pt; word-break: break-all; }
            .label { background-color: #f8f8f8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: bold; text-align: center; width: 15%; }
            
            /* ✅ 一寸照片：改为 contain 模式，保证完整显示不裁切，单元格自适应高度 */
            .photo-cell { 
                text-align: center; 
                vertical-align: middle; 
                padding: 6pt; 
                width: 16%; 
                min-height: 4cm; /* 设定最小高度兜底 */
            }
            .photo-cell img { 
                max-width: 2.5cm; 
                max-height: 3.5cm; 
                width: auto; 
                height: auto; 
                object-fit: contain; /* 关键：等比缩放完整显示 */
                border: 0.5pt solid #999; 
                display: block; 
                margin: 0 auto; 
            }
            
            /* ✅ 身份证照片：限制最大宽高，居中完整呈现 */
            .id-img { 
                max-width: 90%; 
                max-height: 6cm; 
                width: auto; 
                height: auto; 
                object-fit: contain; 
                display: block; 
                margin: 0 auto; 
            }
            .id-label { font-size: 9pt; text-align: center; margin-top: 4pt; color: #333; }
            
            .footer { margin-top: 15pt; font-size: 9pt; text-align: center; color: #333; border-top: 0.75pt dashed #666; padding-top: 8pt; line-height: 1.4; }
        }
    </style>
</head>
<body>
    <h2>📋 培训学员报名表</h2>
    <form id="regForm">
        <div class="form-group"><label>姓名 *</label><input name="name" required></div>
        <div class="form-group" style="display:flex; gap:15px;">
            <div style="flex:1;"><label>性别 *</label><select name="gender" required><option value="男">男</option><option value="女">女</option></select></div>
            <div style="flex:1;"><label>年龄 *</label><input name="age" type="number" required></div>
        </div>
        <div class="form-group"><label>身份证号 *</label><input name="id_card" maxlength="18" required></div>
        <div class="form-group"><label>联系电话 *</label><input name="phone" type="tel" maxlength="11" required></div>
        <div class="form-group"><label>工作单位 *</label><input name="company" required></div>
        <div class="form-group" style="display:flex; gap:15px;">
            <div style="flex:1;"><label>培训类别 *</label><select name="train_type" required><option value="安全生产">安全生产</option><option value="技能提升">技能提升</option><option value="管理培训">管理培训</option></select></div>
            <div style="flex:1;"><label>培训班次 *</label><input name="train_class" placeholder="如：第一期" required></div>
        </div>
        <div class="form-group"><label>计划培训时间 *</label><input name="train_date" type="date" required></div>
        <div class="form-group"><label>个人一寸照片 *</label><input type="file" accept="image/*" id="photoInput" required><div class="preview-box"><img id="photoPreview" class="hidden"></div></div>
        <div class="form-group"><label>身份证正面 (人像面) *</label><input type="file" accept="image/*" id="frontInput" required><p class="tip">上传后系统将自动添加防盗用水印</p><div class="preview-box"><canvas id="frontCanvas" class="hidden"></canvas></div></div>
        <div class="form-group"><label>身份证反面 (国徽面) *</label><input type="file" accept="image/*" id="backInput" required><p class="tip">上传后系统将自动添加防盗用水印</p><div class="preview-box"><canvas id="backCanvas" class="hidden"></canvas></div></div>
        <button type="submit" id="submitBtn">提交并生成PDF报名表</button>
    </form>

    <div id="printArea" class="hidden"></div>

    <script>
        const fileToBase64 = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });

        document.getElementById('photoInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const img = document.getElementById('photoPreview');
                img.src = URL.createObjectURL(e.target.files[0]);
                img.classList.remove('hidden');
            }
        });

        function addWatermark(file, canvasId) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById(canvasId);
                        const maxWidth = 800;
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.35)'; 
                        const fontSize = Math.max(20, width / 22);
                        ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.rotate(-25 * Math.PI / 180); 
                        const text = '本身份证信息仅用于此次培训项目报名及资料归档使用';
                        const textWidth = ctx.measureText(text).width;
                        for (let y = -height; y < height * 2; y += fontSize * 4) {
                            for (let x = -width; x < width * 2; x += textWidth + 80) { ctx.fillText(text, x, y); }
                        }
                        canvas.classList.remove('hidden');
                        resolve(canvas.toDataURL('image/jpeg', 0.8)); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('frontInput').addEventListener('change', function(e) { if(e.target.files[0]) addWatermark(e.target.files[0], 'frontCanvas'); });
        document.getElementById('backInput').addEventListener('change', function(e) { if(e.target.files[0]) addWatermark(e.target.files[0], 'backCanvas'); });

        function generatePDF(data) {
            const printContent = `
                <h1>培训学员报名表</h1>
                <table>
                    <tr>
                        <td class="label">填写时间</td>
                        <td colspan="4">${data.create_time}</td>
                        <td class="photo-cell" rowspan="5"><img src="${data.photo_base64}" alt="一寸照片"></td>
                    </tr>
                    <tr>
                        <td class="label">姓 名</td>
                        <td>${data.name}</td>
                        <td class="label">性 别</td>
                        <td colspan="2">${data.gender}</td>
                    </tr>
                    <tr>
                        <td class="label">年 龄</td>
                        <td>${data.age}</td>
                        <td class="label">电 话</td>
                        <td colspan="2">${data.phone}</td>
                    </tr>
                    <tr>
                        <td class="label">身份证号</td>
                        <td colspan="4">${data.id_card}</td>
                    </tr>
                    <tr>
                        <td class="label">工作单位</td>
                        <td colspan="4">${data.company}</td>
                    </tr>
                    <tr>
                        <td class="label">培训类别</td>
                        <td colspan="2">${data.train_type}</td>
                        <td class="label">培训班次</td>
                        <td colspan="2">${data.train_class}</td>
                    </tr>
                    <tr>
                        <td class="label">计划培训时间</td>
                        <td colspan="5">${data.train_date}</td>
                    </tr>
                    <tr>
                        <td class="label" colspan="6" style="text-align:center; background:#e6e6e6; font-weight:bold; padding: 4pt;">身份证复印件（系统已自动添加专属防伪水印）</td>
                    </tr>
                    <tr>
                        <td colspan="6" style="text-align:center; padding:10pt;">
                            <img src="${data.front_base64}" class="id-img">
                            <div class="id-label">正面 (人像面)</div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="6" style="text-align:center; padding:10pt;">
                            <img src="${data.back_base64}" class="id-img">
                            <div class="id-label">反面 (国徽面)</div>
                        </td>
                    </tr>
                </table>
                <div class="footer">
                    <b>备注：</b>本表需由学员本人填写，培训结束后，由培训单位移交相关政府部门核对后归档备查。
                </div>
            `;
            
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = printContent;
            printArea.classList.remove('hidden');
            
            setTimeout(() => {
                window.print();
                setTimeout(() => {
                    printArea.innerHTML = '';
                    printArea.classList.add('hidden');
                }, 1000);
            }, 300);
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = '正在生成PDF，请稍候...';

            const fd = new FormData(e.target);
            const photoFile = document.getElementById('photoInput').files[0];
            const frontCanvas = document.getElementById('frontCanvas');
            const backCanvas = document.getElementById('backCanvas');
            
            if (frontCanvas.classList.contains('hidden') || backCanvas.classList.contains('hidden')) {
                alert('请等待身份证图片水印处理完成后再提交！');
                btn.disabled = false; btn.innerText = '提交并生成PDF报名表'; return;
            }

            try {
                const photoBase64 = await fileToBase64(photoFile);
                const frontBase64 = frontCanvas.toDataURL('image/jpeg', 0.8);
                const backBase64 = backCanvas.toDataURL('image/jpeg', 0.8);

                const formData = {
                    name: fd.get('name'), gender: fd.get('gender'), age: fd.get('age'),
                    id_card: fd.get('id_card'), phone: fd.get('phone'), company: fd.get('company'),
                    train_type: fd.get('train_type'), train_class: fd.get('train_class'),
                    train_date: fd.get('train_date'), create_time: new Date().toLocaleString('zh-CN'),
                    photo_base64: photoBase64, front_base64: frontBase64, back_base64: backBase64
                };

                generatePDF(formData);
                
                setTimeout(() => {
                    alert('🎉 PDF生成窗口已弹出！\n\n请在打印预览界面中：\n1. 目标打印机选择【另存为PDF】\n2. 勾选【背景图形】\n3. 点击保存即可。');
                    btn.disabled = false; btn.innerText = '提交并生成PDF报名表';
                }, 500);

            } catch (err) {
                alert('生成失败：' + err.message);
                btn.disabled = false; btn.innerText = '提交并生成PDF报名表';
            }
        });
    </script>
</body>
</html>
