<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年湖北省重点危险化学品企业自动化仪表作业人员工伤预防能力提升培训学员登记表</title>
    <style>
        /* 网页端表单样式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 0 auto; padding: 20px; background: #f4f7f6; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 20px; line-height: 1.4; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #07c160; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #a4b0be; cursor: not-allowed; }
        .preview-box { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .preview-box img, .preview-box canvas { max-width: 150px; max-height: 150px; border: 1px solid #ddd; border-radius: 4px; object-fit: cover; }
        .tip { font-size: 12px; color: #888; margin-top: 4px; }
        .hidden { display: none !important; }

        /* 提交成功页面样式 */
        #successPage { text-align: center; padding: 40px 20px; }
        #successPage h3 { color: #07c160; font-size: 22px; margin-bottom: 15px; }
        #successPage p { color: #666; margin: 15px 0; line-height: 1.6; }
        #successPage .tip-text { font-size: 13px; color: #999; margin-top: 25px; }
        #downloadBtn { padding: 14px 40px; background: #07c160; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #backBtn { padding: 12px 30px; background: #fff; color: #666; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 15px; }

        /* ⚠️ 核心：PDF 打印专属样式 */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
            
            @page { size: A4 portrait; margin: 1.5cm; }
            
            body { font-family: '宋体', SimSun, serif !important; font-size: 10.5pt; color: #000; line-height: 1.2; background: #fff; }
            h1 { text-align: center; font-size: 16pt; font-weight: bold; margin: 0 0 12pt 0; letter-spacing: 1pt; font-family: '黑体', SimHei, sans-serif; line-height: 1.4; }
            
            table { width: 100%; border-collapse: collapse; border: 1.5pt solid #000; page-break-inside: avoid; }
            td { border: 0.75pt solid #000; padding: 4pt 6pt; vertical-align: middle; font-size: 10.5pt; word-break: break-all; }
            .label { background-color: #f8f8f8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: bold; text-align: center; width: 15%; }
            
            .photo-cell { text-align: center; vertical-align: middle; padding: 6pt; width: 16%; min-height: 4cm; }
            .photo-cell img { max-width: 2.5cm; max-height: 3.5cm; width: auto; height: auto; object-fit: contain; border: 0.5pt solid #999; display: block; margin: 0 auto; }
            
            .id-img { max-width: 90%; max-height: 6cm; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto; }
            .id-label { font-size: 9pt; text-align: center; margin-top: 4pt; color: #333; }
            
            .footer { margin-top: 15pt; font-size: 9pt; text-align: center; color: #333; border-top: 0.75pt dashed #666; padding-top: 8pt; line-height: 1.4; }
        }
    </style>
</head>
<body>
    <h2>📋 2026年湖北省重点危险化学品企业<br>自动化仪表作业人员工伤预防能力提升培训<br>学员登记表</h2>
    
    <form id="regForm">
        <div class="form-group"><label>姓名 *</label><input name="name" required></div>
        <div class="form-group" style="display:flex; gap:15px;">
            <div style="flex:1;"><label>性别 *</label><select name="gender" required><option value="男">男</option><option value="女">女</option></select></div>
            <div style="flex:1;"><label>年龄 *</label><input name="age" type="number" required></div>
        </div>
        <div class="form-group"><label>身份证号 *</label><input name="id_card" maxlength="18" required></div>
        <div class="form-group"><label>联系电话 *</label><input name="phone" type="tel" maxlength="11" required></div>
        <div class="form-group"><label>工作单位 *</label><input name="company" required></div>
        
        <div class="form-group" style="display:flex; gap:15px;">
            <div style="flex:1;">
                <label>培训类别 *</label>
                <select name="train_type" required>
                    <option value="工伤预防能力提升培训">工伤预防能力提升培训</option>
                    <option value="安全生产">安全生产</option>
                    <option value="技能提升">技能提升</option>
                    <option value="管理培训">管理培训</option>
                </select>
            </div>
            <div style="flex:1;"><label>培训班次 *</label><input name="train_class" placeholder="如：第一期" required></div>
        </div>

        <div class="form-group">
            <label>培训时间 *</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <input name="train_date_start" type="date" required style="flex:1;">
                <span style="color:#666; font-weight:bold;">至</span>
                <input name="train_date_end" type="date" required style="flex:1;">
            </div>
        </div>

        <div class="form-group"><label>个人一寸照片 *</label><input type="file" accept="image/*" id="photoInput" required><div class="preview-box"><img id="photoPreview" class="hidden"></div></div>
        <div class="form-group"><label>身份证正面 (人像面) *</label><input type="file" accept="image/*" id="frontInput" required><p class="tip">上传后系统将自动添加防伪水印</p><div class="preview-box"><canvas id="frontCanvas" class="hidden"></canvas></div></div>
        <div class="form-group"><label>身份证反面 (国徽面) *</label><input type="file" accept="image/*" id="backInput" required><p class="tip">上传后系统将自动添加防伪水印</p><div class="preview-box"><canvas id="backCanvas" class="hidden"></canvas></div></div>
        <button type="submit" id="submitBtn">提交并生成PDF登记表</button>
    </form>

    <!-- 提交成功页面 -->
    <div id="successPage" class="hidden">
        <h3>✅ 提交成功！</h3>
        <p>请点击下方按钮下载PDF登记表</p>
        <button id="downloadBtn">📥 点击下载PDF登记表</button>
        <button id="backBtn">返回重新填写</button>
        <p class="tip-text">
            💡 如点击下载无反应，或您是安卓微信用户：<br>
            请点击右上角「⋮」或「分享」→ 选择「在浏览器中打开」<br>
            然后在浏览器中使用「分享 → 打印 → 保存为PDF」功能
        </p>
    </div>

    <!-- PDF打印专用区域 -->
    <div id="printArea" class="hidden"></div>

    <script>
        // 全局变量，用于存储生成的表单数据
        let currentFormData = null;

        const fileToBase64 = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });

        document.getElementById('photoInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const img = document.getElementById('photoPreview');
                img.src = URL.createObjectURL(e.target.files[0]);
                img.classList.remove('hidden');
            }
        });

        // 核心水印生成函数（红色、透明度0.12、稀疏平铺）
        function addWatermark(file, canvasId) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById(canvasId);
                        
                        const maxWidth = 800;
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                        
                        canvas.width = width; 
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 红色 + 透明度0.12
                        ctx.fillStyle = 'rgba(220, 30, 30, 0.12)'; 
                        
                        const fontSize = Math.max(20, width / 25);
                        ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.rotate(-25 * Math.PI / 180); 
                        
                        const text = '仅供工伤预防培训备案使用';
                        const textWidth = ctx.measureText(text).width;
                        
                        const stepX = textWidth + width / 4;
                        const stepY = fontSize * 6;
                        
                        for (let y = -height; y < height * 2; y += stepY) {
                            for (let x = -width; x < width * 2; x += stepX) { 
                                ctx.fillText(text, x, y); 
                            }
                        }
                        
                        canvas.classList.remove('hidden');
                        resolve(canvas.toDataURL('image/jpeg', 0.8)); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('frontInput').addEventListener('change', function(e) { if(e.target.files[0]) addWatermark(e.target.files[0], 'frontCanvas'); });
        document.getElementById('backInput').addEventListener('change', function(e) { if(e.target.files[0]) addWatermark(e.target.files[0], 'backCanvas'); });

        // 生成PDF内容并渲染到打印区域（不自动触发打印）
        function generatePDFContent(data) {
            const printContent = `
                <h1>2026年湖北省重点危险化学品企业自动化仪表作业人员<br>工伤预防能力提升培训学员登记表</h1>
                <table>
                    <tr>
                        <td class="label">填写时间</td>
                        <td colspan="4">${data.create_time}</td>
                        <td class="photo-cell" rowspan="5"><img src="${data.photo_base64}" alt="一寸照片"></td>
                    </tr>
                    <tr>
                        <td class="label">姓 名</td>
                        <td>${data.name}</td>
                        <td class="label">性 别</td>
                        <td colspan="2">${data.gender}</td>
                    </tr>
                    <tr>
                        <td class="label">年 龄</td>
                        <td>${data.age}</td>
                        <td class="label">电 话</td>
                        <td colspan="2">${data.phone}</td>
                    </tr>
                    <tr>
                        <td class="label">身份证号</td>
                        <td colspan="4">${data.id_card}</td>
                    </tr>
                    <tr>
                        <td class="label">工作单位</td>
                        <td colspan="4">${data.company}</td>
                    </tr>
                    <tr>
                        <td class="label">培训类别</td>
                        <td colspan="2">${data.train_type}</td>
                        <td class="label">培训班次</td>
                        <td colspan="2">${data.train_class}</td>
                    </tr>
                    <tr>
                        <td class="label">培训时间</td>
                        <td colspan="5">${data.train_date_start} 至 ${data.train_date_end}</td>
                    </tr>
                    <tr>
                        <td class="label" colspan="6" style="text-align:center; background:#e6e6e6; font-weight:bold; padding: 4pt;">身份证复印件（系统已自动添加专属防伪水印）</td>
                    </tr>
                    <tr>
                        <td colspan="6" style="text-align:center; padding:10pt;">
                            <img src="${data.front_base64}" class="id-img">
                            <div class="id-label">正面 (人像面)</div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="6" style="text-align:center; padding:10pt;">
                            <img src="${data.back_base64}" class="id-img">
                            <div class="id-label">反面 (国徽面)</div>
                        </td>
                    </tr>
                </table>
                <div class="footer">
                    <b>备注：</b>本表需由学员本人填写，培训结束后，由培训单位移交相关政府部门核对后归档备查。
                </div>
            `;
            
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = printContent;
            printArea.classList.remove('hidden');
        }

        // 检测是否为安卓微信环境
        function isAndroidWeChat() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.includes('micromessenger') && ua.includes('android');
        }

        // 显示提交成功页面
        function showSuccessPage() {
            document.getElementById('regForm').classList.add('hidden');
            document.querySelector('h2').classList.add('hidden');
            const successPage = document.getElementById('successPage');
            successPage.classList.remove('hidden');

            // 如果是安卓微信，先弹出提示
            if (isAndroidWeChat()) {
                setTimeout(() => {
                    alert('⚠️ 检测到您在微信中打开\n\n微信内置浏览器可能无法直接下载PDF。\n\n请点击右上角「⋮」→ 选择「在浏览器中打开」，然后在浏览器中完成下载。');
                }, 300);
            }
        }

        // 绑定下载按钮点击事件
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!currentFormData) return;
            
            // 重新生成PDF内容（确保打印区域有内容）
            generatePDFContent(currentFormData);
            
            // 由用户真实点击触发打印/保存
            setTimeout(() => {
                window.print();
            }, 100);
        });

        // 绑定返回按钮点击事件
        document.getElementById('backBtn').addEventListener('click', function() {
            location.reload();
        });

        // 表单提交处理
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = '正在生成PDF，请稍候...';

            const fd = new FormData(e.target);
            const photoFile = document.getElementById('photoInput').files[0];
            const frontCanvas = document.getElementById('frontCanvas');
            const backCanvas = document.getElementById('backCanvas');
            
            if (frontCanvas.classList.contains('hidden') || backCanvas.classList.contains('hidden')) {
                alert('请等待身份证图片水印处理完成后再提交！');
                btn.disabled = false; btn.innerText = '提交并生成PDF登记表'; return;
            }

            try {
                const photoBase64 = await fileToBase64(photoFile);
                const frontBase64 = frontCanvas.toDataURL('image/jpeg', 0.8);
                const backBase64 = backCanvas.toDataURL('image/jpeg', 0.8);

                currentFormData = {
                    name: fd.get('name'), gender: fd.get('gender'), age: fd.get('age'),
                    id_card: fd.get('id_card'), phone: fd.get('phone'), company: fd.get('company'),
                    train_type: fd.get('train_type'), train_class: fd.get('train_class'),
                    train_date_start: fd.get('train_date_start'), 
                    train_date_end: fd.get('train_date_end'),
                    create_time: new Date().toLocaleString('zh-CN'),
                    photo_base64: photoBase64, front_base64: frontBase64, back_base64: backBase64
                };

                // 显示提交成功页面和下载按钮
                showSuccessPage();
                btn.disabled = false; btn.innerText = '提交并生成PDF登记表';

            } catch (err) {
                alert('生成失败：' + err.message);
                btn.disabled = false; btn.innerText = '提交并生成PDF登记表';
            }
        });
    </script>
</body>
</html>
